model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
default_permissions = "secure-workspace"
approval_policy = "on-request"
approvals_reviewer = "user"

[permissions.secure-workspace]
description = "Workspace access with common credential and secret files denied."
extends = ":workspace"

[permissions.secure-workspace.filesystem]
# Linux expands recursive deny globs before starting the sandbox. Eight levels
# covers typical source trees without making sandbox startup unnecessarily slow.
glob_scan_max_depth = 8
"~/.ssh" = "deny"
"~/.gnupg" = "deny"
"~/.aws" = "deny"
"~/.azure" = "deny"
"~/.oci" = "deny"
"~/.kube" = "deny"
"~/.docker/config.json" = "deny"
"~/.config/containers/auth.json" = "deny"
"~/.config/gcloud" = "deny"
"~/.config/gh/hosts.yml" = "deny"
"~/.config/glab-cli/config.yml" = "deny"
"~/.config/op" = "deny"
"~/.config/age" = "deny"
"~/.config/sops/age" = "deny"
"~/.config/rclone/rclone.conf" = "deny"
"~/.config/pulumi/credentials.json" = "deny"
"~/.config/pypoetry/auth.toml" = "deny"
"~/.config/composer/auth.json" = "deny"
"~/.local/share/keyrings" = "deny"
"~/.password-store" = "deny"
"~/.terraform.d/credentials.tfrc.json" = "deny"
"~/.gem/credentials" = "deny"
"~/.cargo/credentials.toml" = "deny"
"~/.netrc" = "deny"
"~/.npmrc" = "deny"
"~/.pypirc" = "deny"
"~/.git-credentials" = "deny"
"~/.codex/auth.json" = "deny"

[permissions.secure-workspace.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.key" = "deny"
"**/*.pem" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"**/*.jks" = "deny"
"**/*.keystore" = "deny"
"**/id_rsa" = "deny"
"**/id_dsa" = "deny"
"**/id_ecdsa" = "deny"
"**/id_ed25519" = "deny"

[permissions.secure-workspace.network]
enabled = false

