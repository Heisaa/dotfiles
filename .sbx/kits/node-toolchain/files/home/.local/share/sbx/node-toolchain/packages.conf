# Dependencies installed into every sandbox that uses the node-toolchain kit.
# Edit this file and the next sandbox you create picks it up. To push the
# change into a sandbox that already exists, remove and recreate it with
# sbx-agent (startup kits cannot be applied with sbx kit add).

# Node.js major version. Installed from nodejs.org into /opt/node and linked
# into /usr/local/bin, which precedes the distro node on PATH. Empty = skip.
NODE_MAJOR=26

# Extra apt packages. libatomic1 is always installed alongside Node (the
# official builds link against it and the base image lacks it).
APT_PACKAGES=""

# Packages to install globally with the new npm, into $NPM_CONFIG_PREFIX.
# Versions may be pinned: "typescript@5.9.2 pnpm".
NPM_GLOBAL_PACKAGES=""

# Playwright Test + matching Chromium and headless shell. Empty skips this.
# Pin together so restarts do not silently change the browser/test runner.
PLAYWRIGHT_VERSION="1.63.0"
