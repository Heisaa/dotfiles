# Hyprland Configuration
# Converted from Sway config
# For more configuration options, see: https://wiki.hyprland.org/Configuring/

### Variables
$mod = SUPER
$term = foot
$launcher = foot --app-id=launcher ~/.config/sway/sway-launcher-desktop.sh

### Monitor Configuration
# You can get monitor names with: hyprctl monitors
# Example: monitor=HDMI-A-1,1920x1080@60,1920x0,1
monitor=,preferred,auto,1

### Wallpaper
exec-once = swaybg -i /home/hsa/Pictures/pirlot_bath.jpg -m center

### Autostart
# exec-once = pkill kanshi; kanshi

### Input Configuration
input {
    kb_layout = eu,se
    kb_options = grp:win_space_toggle,caps:escape
    
    follow_mouse = 1
    
    touchpad {
        natural_scroll = false
        disable_while_typing = true
        tap-to-click = true
        drag_lock = false
    }
    
    sensitivity = 0 # -1.0 to 1.0, 0 means no modification (flat accel profile for mouse)
    accel_profile = flat
}

### General Window Configuration
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    
    layout = dwindle
}

### Decoration
decoration {
    rounding = 0
    
    blur {
        enabled = false
    }
    
}

### Animations
animations {
    enabled = true
    
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    
    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 2, default
}

### Layout Configuration
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}


### Misc Settings
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

### Window Rules
# Floating launcher window
windowrulev2 = float, class:^(launcher)$
windowrulev2 = noborder, class:^(launcher)$

# Blueman manager floating
windowrulev2 = float, class:^(blueman-manager)$

### Workspace Configuration with Emoji Names
# Hyprland doesn't directly support emoji in workspace names via persistent:true
# We'll use workspace rules and name them when switching
workspace = 1, name:🦆
workspace = 2, name:🌊
workspace = 3, name:🦅
workspace = 4, name:🌈
workspace = 5, name:🌲
workspace = 6, name:🤹
workspace = 7, name:🌍
workspace = 8, name:🔑
workspace = 9, name:🦉
workspace = 10, name:🍕

### Keybindings

# Basic bindings
bind = $mod, Return, exec, $term
bind = $mod, Escape, killactive
bind = $mod, D, exec, $launcher
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, X, exit

# Screenshot (using grim + slurp)
bind = $mod SHIFT, S, exec, grim -g "$(slurp -d)" - | wl-copy

# Media keys
bindl = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +3%
bindl = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -3%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%

# Move focus with vim keys
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Move focus with arrow keys
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

# Move windows with vim keys
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Move windows with arrow keys
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

# Switch workspaces (q-p row)
bind = $mod, Q, workspace, 1
bind = $mod, W, workspace, 2
bind = $mod, E, workspace, 3
bind = $mod, R, workspace, 4
bind = $mod, T, workspace, 5
bind = $mod, Y, workspace, 6
bind = $mod, U, workspace, 7
bind = $mod, I, workspace, 8
bind = $mod, O, workspace, 9
bind = $mod, P, workspace, 10

# Move windows to workspaces (q-p row with Shift)
bind = $mod SHIFT, Q, movetoworkspace, 1
bind = $mod SHIFT, W, movetoworkspace, 2
bind = $mod SHIFT, E, movetoworkspace, 3
bind = $mod SHIFT, R, movetoworkspace, 4
bind = $mod SHIFT, T, movetoworkspace, 5
bind = $mod SHIFT, Y, movetoworkspace, 6
bind = $mod SHIFT, U, movetoworkspace, 7
bind = $mod SHIFT, I, movetoworkspace, 8
bind = $mod SHIFT, O, movetoworkspace, 9
bind = $mod SHIFT, P, movetoworkspace, 10

# Layout controls
bind = $mod, B, layoutmsg, preselect l
bind = $mod, V, layoutmsg, preselect d
bind = $mod, F, fullscreen, 0
bind = $mod, S, layoutmsg, togglesplit # Closest to stacking
bind = $mod, X, pseudo # Pseudo-tiling for tabbed-like behavior
bind = $mod, Z, layoutmsg, togglesplit # Default/toggle split

# Floating controls
bind = $mod SHIFT, Space, togglefloating
bind = $mod, Space, focuscurrentorlast

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
