# mango config, set up to feel like ~/.config/sway/config.
# Reference: https://github.com/mangowm/mango/wiki
# Check for errors without restarting: mango -c ~/.config/mango/config.conf -p
#
# The biggest differences from sway:
# - Workspaces are "tags" (1-9) and each monitor has its own set. Super+q..o
#   works as before, but switches tags on the focused monitor only.
# - There is no split tree (splith/splitv, focus parent/child). Each tag has a
#   layout that places windows for you: scroller (the default here), tile,
#   monocle (like tabbed), deck (like stacking), dwindle, grid... All of them
#   are explained above the tag_rule lines.
# - The scratchpad is the same idea: Super+Shift+minus hides a window
#   ("minimized"), Super+minus shows/hides it.

var=term,foot

# Autostart (exec_once = startup only, exec = every reload, like exec_always)
# Sway gets this from /etc/sway/config.d/50-systemd-user.conf; portals, dunst
# and other D-Bus-activated services need it to find the session.
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec=~/.config/sway/wallpaper/wallpaper.sh
# Bar: ~/.config/waybar, set up to look like the swaybar. Restart it after
# editing its config with: pkill waybar; waybar &
exec_once=waybar

# Monitor layout: ~/.config/kanshi/config (shared with sway), which matches
# the docked monitors by serial since their DP-N names change.
exec_once=kanshi

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

# Square corners like sway
border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
# Sway has none; these are kept but shortened so they don't slow you down.
# Set animations=0 if they get in the way.
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=200
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
# new_is_master=0: new windows join the stack instead of pushing the current
# window aside, which is closer to how sway adds windows.
new_is_master=0
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
# Like sway: moving focus past the screen edge continues on the next monitor
focus_cross_monitor=1
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard (from sway's input type:keyboard)
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=eu,se
xkb_rules_options=grp:win_space_toggle,caps:escape

# Trackpad (from sway's input type:touchpad)
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=0
drag_lock=0
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse (from sway's input type:pointer: accel_profile flat)
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=1

# Appearance: no gaps and a 1px border like sway, colors from the sway config
# and the wallpaper's greys.
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=1
root_color=0x000000ff
border_color=0x2e2e2eff
drop_color=0x3971ED55
split_color=0x3971EDff
focus_color=0x858c94ff
maximized_screen_color=0x858c94ff
urgent_color=0x900000ff
scratchpad_color=0x3971EDff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# Layouts (each tag has its own; the lines below set what a tag starts with):
#   scroller     windows side by side in a horizontal strip wider than the screen,
#                scrolled to keep the focused one in view, like niri/PaperWM.
#                New windows open at 80% width; Super+b cycles 50/80/100%. (Super+v)
#   tile         one big "master" window on the left, the rest stacked on the
#                right. Super+a swaps a window into master, Super+[ ] resizes it,
#                Super+Shift+[ ] changes how many windows share it. (Super+z)
#   right_tile   tile with the master on the right.
#   center_tile  master in the middle, the others stacked on both sides; good on
#                wide screens.
#   monocle      one window fills the screen, the others hidden behind it; like
#                sway's tabbed. (Super+x)
#   deck         master stays visible, the other windows overlap in one stack
#                beside it, only the focused one shown; like sway's stacking. (Super+s)
#   grid         all windows the same size in rows and columns.
#   fair         like grid: windows split the screen evenly.
#   dwindle      each new window splits the focused one in half, alternating
#                directions, giving a spiral; the closest to sway's split tree.
#   vertical_tile, vertical_scroller, vertical_grid, vertical_deck, vertical_fair
#                the same turned 90 degrees (stack along the bottom, scroll
#                up/down); handy on the rotated monitor.
# Super+c cycles through all of them.
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# Window rules (sway's for_window)
window_rule=is_floating:1,no_border:1,width:400,height:600,app_id:^launcher$
window_rule=is_floating:1,no_border:1,width:1000,height:700,app_id:^launcher-term$
window_rule=is_floating:1,app_id:^blueman-manager$
window_rule=is_floating:1,app_id:^move-reminder-timer$

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# Basics
bind=SUPER,Return,spawn,$term
bind=SUPER,Escape,killclient,
bind=SUPER,d,spawn,$term --app-id=launcher ~/.config/sway/sway-launcher-desktop.sh
bind=SUPER+SHIFT,c,reload_config
# Exit asks for confirmation, like the swaynag prompt: Super+Shift+x, then y
bind=SUPER+SHIFT,x,setkeymode,exit
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp -d)" - | wl-copy
bind=SUPER+SHIFT,d,spawn,~/.config/scripts/theme.sh dark
bind=SUPER+SHIFT,f,spawn,~/.config/scripts/theme.sh light
# Hibernate: Super+Shift+z, then h
bind=SUPER+SHIFT,z,setkeymode,hibernate

# Special keys (l = also work on the lock screen)
bindl=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +3%
bindl=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -3%
bindl=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%

# Move focus
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Move the focused window (swaps places with the neighbour)
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# Workspaces -> tags. Super+key views, Super+Shift+key sends the window
# there without following (like sway's move container to workspace).
# There are only 9 tags, so p (workspace 10) is unused.
bind=SUPER,q,view,1,0
bind=SUPER,w,view,2,0
bind=SUPER,e,view,3,0
bind=SUPER,r,view,4,0
bind=SUPER,t,view,5,0
bind=SUPER,y,view,6,0
bind=SUPER,u,view,7,0
bind=SUPER,i,view,8,0
bind=SUPER,o,view,9,0
bind=SUPER+SHIFT,q,tagsilent,1
bind=SUPER+SHIFT,w,tagsilent,2
bind=SUPER+SHIFT,e,tagsilent,3
bind=SUPER+SHIFT,r,tagsilent,4
bind=SUPER+SHIFT,t,tagsilent,5
bind=SUPER+SHIFT,y,tagsilent,6
bind=SUPER+SHIFT,u,tagsilent,7
bind=SUPER+SHIFT,i,tagsilent,8
bind=SUPER+SHIFT,o,tagsilent,9

# Monitors. Each monitor has its own tags, so "move to workspace on the other
# screen" is: send the window to the other monitor.
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,j,focusmon,down
bind=SUPER+CTRL,k,focusmon,up
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL+SHIFT,h,tagmon,left
bind=SUPER+CTRL+SHIFT,j,tagmon,down
bind=SUPER+CTRL+SHIFT,k,tagmon,up
bind=SUPER+CTRL+SHIFT,l,tagmon,right

# Window state
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,space,togglefloating,
# (Super+space stays the keyboard layout toggle from xkb_rules_options)

# Layouts, on the same keys as sway's layout commands
bind=SUPER,z,setlayout,tile
bind=SUPER,x,setlayout,monocle
bind=SUPER,s,setlayout,deck
# Scroller: windows in a horizontal strip, like niri
bind=SUPER,v,setlayout,scroller
bind=SUPER,c,switch_layout

# New in mango, worth learning
# Swap the focused window with the master (big) window
bind=SUPER,a,zoom,
# Maximize within the gaps/bar (fullscreen without covering the bar)
bind=SUPER,m,togglemaximizescreen,
# Jump back to the previously focused window
bind=SUPER,Tab,focuslast,
# Overview of all windows on all tags; click or Super+grave to pick
bind=SUPER,grave,toggleoverview,
# Sticky: show this window on every tag
bind=SUPER,g,toggleglobal,
# Master area: wider/narrower, more/fewer windows in it
bind=SUPER,bracketleft,setmfact,-0.05
bind=SUPER,bracketright,setmfact,+0.05
bind=SUPER+SHIFT,bracketright,incnmaster,+1
bind=SUPER+SHIFT,bracketleft,incnmaster,-1
# Cycle the window width in the scroller layout
bind=SUPER,b,switch_proportion_preset,

# Scratchpad
bind=SUPER+SHIFT,minus,minimized,
bind=SUPER,minus,toggle_scratchpad,
bind=SUPER+CTRL,minus,restore_minimized

# Resize: Super+period enters resize mode (see key modes at the bottom)
bind=SUPER,period,setkeymode,resize

# Mouse Button Bindings (sway's floating_modifier $mod normal)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings: Super+scroll moves to the previous/next tag that has windows
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# Key modes (sway's mode blocks). Everything after a key_mode line belongs to
# that mode, so these must stay at the end of the file.

key_mode=resize
bind=NONE,h,resizewin,-10,+0
bind=NONE,j,resizewin,+0,+10
bind=NONE,k,resizewin,+0,-10
bind=NONE,l,resizewin,+10,+0
bind=NONE,Left,resizewin,-10,+0
bind=NONE,Down,resizewin,+0,+10
bind=NONE,Up,resizewin,+0,-10
bind=NONE,Right,resizewin,+10,+0
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=hibernate
bind=NONE,h,spawn,~/.config/mango/hibernate.sh
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=exit
bind=NONE,y,quit
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default
